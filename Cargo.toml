[package]
name = "opificium"
version = "0.6.2"
edition = "2024"
description = "A maker's bench for buildings and animations: authored by hand, exported as files, and read by whatever game asked for them."

# Its own repository now, and its own workspace within it. Opificium and
# the games that use it are separate programs that speak only through
# files - see FORMATS.md - so no game's build, CI or packaging ever sees
# this crate, and this crate never sees theirs.
[workspace]

[dependencies]
arboard = "3.6.1"
# `jpeg` is not one of Bevy's default image formats, and a generated model's
# textures usually are JPEG - without it the whole glTF fails to load with
# "invalid image mime type: image/jpeg" and the model is simply absent. Fly on
# the Wall hit this with its own fly and wrote the same note; the kiln hit it the
# first time it stood a model on the stage.
bevy = { version = "0.19", features = ["jpeg"] }
# The terrain bench reads a game's map image on the CPU, at startup, before the
# first frame - the ground's height has to be answerable synchronously or no
# chunk can be meshed and no brush can be aimed. Bevy's own image assets load
# asynchronously and normally live GPU-side only, so the decoder is taken
# directly. Already in the tree underneath Bevy; naming it here costs nothing.
image = "0.25"
# Fractal noise for the terrain bench: the detail a map image cannot carry.
noise = "0.9"
rfd = "0.17.2"
# The world generation and the sculpting brush the terrain bench runs — and so
# does every game whose ground it shapes. Written once, so a bench and a game
# cannot disagree about what the ground is.
#
# A git dependency and not a path one on purpose: the repositories are separate
# on GitHub and CI checks out only one, so a path would build on a developer's
# machine and fail every release.
#
# It names no engine, which is what lets this bench on Bevy 0.19 and a game on
# 0.16 link the same code.
terrain-core = { git = "https://github.com/Baz-Studios-LLC/terrain-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.0", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
