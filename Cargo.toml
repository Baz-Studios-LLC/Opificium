[package]
name = "opificium"
version = "0.4.2"
edition = "2024"
description = "A maker's bench for buildings and animations: authored by hand, exported as files, and read by whatever game asked for them."

# Its own repository now, and its own workspace within it. Opificium and
# the games that use it are separate programs that speak only through
# files - see FORMATS.md - so no game's build, CI or packaging ever sees
# this crate, and this crate never sees theirs.
[workspace]

[dependencies]
bevy = "0.19"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
